 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Market</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* ==============================
           ENCABEZADO
        ============================== */

        header {
            background: #2e7d32;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
        }

        /* ==============================
           CONTENEDOR
        ============================== */

        .contenedor {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        /* ==============================
           BUSCADOR
        ============================== */

        .buscador {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* ==============================
           CATEGORÍAS
        ============================== */

        .categoria {
            margin-bottom: 30px;
        }

        .categoria h2 {
            color: #2e7d32;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 8px;
        }

        /* ==============================
           PRODUCTOS
        ============================== */

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .producto {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .producto h3 {
            margin-top: 0;
            word-break: break-word;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
        }

        .cantidad {
            color: #555;
            margin: 10px 0;
        }

        .producto button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }

        .producto button:hover {
            background: #1b5e20;
        }

        /* ==============================
           BOTÓN DEL CARRITO
        ============================== */

        .carrito-boton {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            font-size: 15px;
        }

        /* ==============================
           CARRITO
        ============================== */

        .carrito {
            display: none;
            position: fixed;
            top: 70px;
            right: 20px;
            width: 350px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.3);
            z-index: 999;
        }

        .carrito h2 {
            margin-top: 0;
        }

        .carrito-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
            gap: 8px;
        }

        .controles {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .controles button {
            border: none;
            background: #2e7d32;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            padding: 0;
        }

        .eliminar {
            background: #c62828 !important;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }

        /* ==============================
           PIE DE PÁGINA
        ============================== */

        footer {
            background: #2e7d32;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

        /* ==================================================
           PUNTO 14 - ADAPTACIÓN PARA CELULARES
        ================================================== */

        @media (max-width: 768px) {

            header {
                padding: 70px 15px 20px;
            }

            header h1 {
                font-size: 27px;
            }

            header p {
                font-size: 14px;
            }

            .contenedor {
                width: 94%;
                margin: 20px auto;
            }

            .buscador {
                font-size: 16px;
                padding: 13px;
            }

            .productos {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .producto {
                padding: 14px 10px;
            }

            .producto h3 {
                font-size: 17px;
            }

            .precio {
                font-size: 18px;
            }

            .cantidad {
                font-size: 14px;
            }

            .producto button {
                font-size: 14px;
                padding: 10px 6px;
            }

            .carrito-boton {
                top: 12px;
                right: 12px;
                padding: 10px 13px;
                font-size: 14px;
            }

            .carrito {
                top: 62px;
                right: 5%;
                width: 90%;
                max-width: none;
                max-height: 75vh;
                padding: 15px;
            }

            .carrito-item {
                align-items: center;
            }

            .controles {
                gap: 4px;
            }

            .controles button {
                width: 30px;
                height: 30px;
            }

            footer {
                font-size: 13px;
            }
        }

        /* ==============================
           CELULARES PEQUEÑOS
        ============================== */

        @media (max-width: 480px) {

            header {
                padding-top: 65px;
            }

            header h1 {
                font-size: 24px;
            }

            header p {
                font-size: 13px;
            }

            .productos {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .producto {
                padding: 12px 8px;
            }

            .producto h3 {
                font-size: 16px;
            }

            .precio {
                font-size: 17px;
            }

            .cantidad {
                font-size: 13px;
            }

            .producto button {
                font-size: 13px;
                padding: 9px 5px;
            }

            .carrito {
                width: 94%;
                right: 3%;
            }

            .carrito-item {
                flex-direction: column;
                align-items: stretch;
            }

            .controles {
                justify-content: center;
            }

            footer {
                padding: 12px 8px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Market</h1>
        <p>Tu tienda virtual de confianza</p>
    </header>

    <button class="carrito-boton" onclick="mostrarCarrito()">
        🛒 Carrito (<span id="contador">0</span>)
    </button>

    <div id="carrito" class="carrito">

        <h2>🛒 Mi carrito</h2>

        <div id="carritoProductos"></div>

        <div class="total">
            Total: $<span id="total">0</span>
        </div>

    </div>

    <main class="contenedor">

        <input
            type="text"
            id="buscador"
            class="buscador"
            placeholder="🔎 Buscar producto..."
            oninput="buscarProducto()"
        >

        <div id="catalogo"></div>

    </main>

    <footer>
        <p>©️ 2026 Online Market - Todos los derechos reservados</p>
    </footer>


    <script>

        let productos = [];
        let carrito = [];


        // ======================================
        // CARGAR PRODUCTOS
        // ======================================

        async function cargarProductos() {

            try {

                const respuesta = await fetch("/api/productos");

                productos = await respuesta.json();

                mostrarProductos(productos);

            } catch (error) {

                console.error("Error:", error);

                document.getElementById("catalogo").innerHTML =
                    "<p>No se pudieron cargar los productos.</p>";
            }
        }


        // ======================================
        // MOSTRAR PRODUCTOS
        // ======================================

        function mostrarProductos(lista) {

            const catalogo = document.getElementById("catalogo");

            catalogo.innerHTML = "";

            if (lista.length === 0) {

                catalogo.innerHTML =
                    "<p>No se encontraron productos.</p>";

                return;
            }


            const categorias = {};

            lista.forEach(producto => {

                const categoria =
                    producto.categoria_id || "Sin categoría";

                if (!categorias[categoria]) {

                    categorias[categoria] = [];

                }

                categorias[categoria].push(producto);

            });


            Object.keys(categorias).forEach(categoria => {

                const seccion =
                    document.createElement("div");

                seccion.className = "categoria";

                seccion.innerHTML = `
                    <h2>Categoría ${categoria}</h2>
                    <div class="productos"></div>
                `;

                const contenedorProductos =
                    seccion.querySelector(".productos");


                categorias[categoria].forEach(producto => {

                    const tarjeta =
                        document.createElement("div");

                    tarjeta.className = "producto";

                    tarjeta.innerHTML = `
                        <h3>${producto.nombre}</h3>

                        <p class="precio">
                            $${Number(producto.precio).toLocaleString("es-CO")}
                        </p>

                        <p class="cantidad">
                            Disponible: ${producto.cantidad}
                        </p>

                        <button onclick="agregarCarrito(${producto.id})">
                            Agregar al carrito
                        </button>
                    `;

                    contenedorProductos.appendChild(tarjeta);

                });


                catalogo.appendChild(seccion);

            });

        }


        // ======================================
        // BUSCAR PRODUCTO
        // ======================================

        function buscarProducto() {

            const texto =
                document.getElementById("buscador")
                .value
                .toLowerCase();

            const filtrados =
                productos.filter(producto =>
                    producto.nombre
                    .toLowerCase()
                    .includes(texto)
                );

            mostrarProductos(filtrados);

        }


        // ======================================
        // AGREGAR AL CARRITO
        // ======================================

        function agregarCarrito(id) {

            const producto =
                productos.find(p => p.id === id);

            if (!producto) return;


            const existente =
                carrito.find(item => item.id === id);


            if (existente) {

                if (existente.cantidad < producto.cantidad) {

                    existente.cantidad++;

                } else {

                    alert("No hay más unidades disponibles.");

                    return;
                }

            } else {

                carrito.push({

                    id: producto.id,
                    nombre: producto.nombre,
                    precio: Number(producto.precio),
                    cantidad: 1,
                    disponible: Number(producto.cantidad)

                });

            }


            actualizarCarrito();

        }


        // ======================================
        // MOSTRAR CARRITO
        // ======================================

        function mostrarCarrito() {

            const carritoDiv =
                document.getElementById("carrito");

            if (carritoDiv.style.display === "block") {

                carritoDiv.style.display = "none";

            } else {

                carritoDiv.style.display = "block";

            }

        }


        // ======================================
        // ACTUALIZAR CARRITO
        // ======================================

        function actualizarCarrito() {

            const contenedor =
                document.getElementById("carritoProductos");

            const contador =
                document.getElementById("contador");

            const totalElemento =
                document.getElementById("total");


            contenedor.innerHTML = "";

            let total = 0;
            let cantidadTotal = 0;


            carrito.forEach((item, indice) => {

                total +=
                    item.precio * item.cantidad;

                cantidadTotal +=
                    item.cantidad;


                const div =
                    document.createElement("div");

                div.className = "carrito-item";


                div.innerHTML = `

                    <div>
                        <strong>${item.nombre}</strong>
                        <br>
                        $${item.precio.toLocaleString("es-CO")}
                    </div>

                    <div class="controles">

                        <button onclick="disminuirCantidad(${indice})">
                            -
                        </button>

                        <span>${item.cantidad}</span>

                        <button onclick="aumentarCantidad(${indice})">
                            +
                        </button>

                        <button
                            class="eliminar"
                            onclick="eliminarDelCarrito(${indice})">
                            🗑️
                        </button>

                    </div>

                `;


                contenedor.appendChild(div);

            });


            contador.textContent =
                cantidadTotal;

            totalElemento.textContent =
                total.toLocaleString("es-CO");

        }


        // ======================================
        // AUMENTAR CANTIDAD
        // ======================================

        function aumentarCantidad(indice) {

            const item =
                carrito[indice];


            if (item.cantidad < item.disponible) {

                item.cantidad++;

                actualizarCarrito();

            } else {

                alert("No hay más unidades disponibles.");

            }

        }


        // ======================================
        // DISMINUIR CANTIDAD
        // ======================================

        function disminuirCantidad(indice) {

            if (carrito[indice].cantidad > 1) {

                carrito[indice].cantidad--;

            } else {

                carrito.splice(indice, 1);

            }

            actualizarCarrito();

        }


        // ======================================
        // ELIMINAR DEL CARRITO
        // ======================================

        function eliminarDelCarrito(indice) {

            carrito.splice(indice, 1);

            actualizarCarrito();

        }


        // ======================================
        // INICIAR
        // ======================================

        cargarProductos();

    </script>

</body>
</html>
