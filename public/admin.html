 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración - Online Market</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        h2 {
            color: #333;
        }

        .contenedor {
            max-width: 1200px;
            margin: auto;
        }

        /* MENSAJES */
        #mensaje {
            display: none;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        /* LOGIN */
        #login {
            max-width: 500px;
            margin: 60px auto;
        }

        #login .formulario {
            text-align: center;
        }

        #login input {
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0;
        }

        #login button {
            width: 100%;
            margin: 8px 0;
        }

        /* RESUMEN */
        .resumen {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tarjeta h3 {
            margin: 5px 0;
            color: #555;
        }

        .tarjeta p {
            font-size: 25px;
            font-weight: bold;
            margin: 10px 0;
            color: #2e7d32;
        }

        .tarjeta .alerta {
            color: #f9a825;
        }

        .tarjeta .agotado {
            color: #d32f2f;
        }

        /* FORMULARIO */
        .formulario {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input,
        select,
        button {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .btn-cancelar {
            background: #757575;
        }

        .btn-cancelar:hover {
            background: #555;
        }

        /* TABLA */
        .contenedor-tabla {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #2e7d32;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .btn-editar {
            background: #1976d2;
        }

        .btn-editar:hover {
            background: #0d47a1;
        }

        .btn-eliminar {
            background: #d32f2f;
        }

        .btn-eliminar:hover {
            background: #b71c1c;
        }

        /* CELULAR */
        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 21px;
            }

            .resumen {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .tarjeta {
                padding: 15px;
            }

            .tarjeta h3 {
                font-size: 14px;
            }

            .tarjeta p {
                font-size: 20px;
            }

            .formulario {
                padding: 15px;
            }

            input,
            select,
            button {
                width: 100%;
                box-sizing: border-box;
                margin: 5px 0;
            }

            .contenedor-tabla {
                overflow-x: auto;
                width: 100%;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 7px 5px;
            }
        }

        /* CELULARES PEQUEÑOS */
        @media (max-width: 480px) {

            .resumen {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 23px;
            }

            h2 {
                font-size: 19px;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 5px 3px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>🔐 Panel de Administración</h1>

    <!-- LOGIN -->

    <div id="login">

        <div class="formulario">

            <h2>Ingresar</h2>

            <input
                type="text"
                id="usuario"
                placeholder="Usuario"
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
            >

            <button onclick="ingresar()">
                Entrar
            </button>

        </div>

    </div>


    <!-- PANEL CRUD -->

    <div id="panel" style="display:none;">

        <div id="mensaje"></div>


        <!-- RESUMEN -->

        <div class="resumen">

            <div class="tarjeta">

                <h3>📦 Total de productos</h3>

                <p id="totalProductos">
                    0
                </p>

            </div>


            <div class="tarjeta">

                <h3>💰 Valor del inventario</h3>

                <p id="valorInventario">
                    $0
                </p>

            </div>


            <div class="tarjeta">

                <h3>⚠️ Poco stock</h3>

                <p id="pocoStock" class="alerta">
                    0
                </p>

            </div>


            <div class="tarjeta">

                <h3>🚨 Agotados</h3>

                <p id="agotados" class="agotado">
                    0
                </p>

            </div>

        </div>


        <!-- CREAR / EDITAR -->

        <div class="formulario">

            <h2 id="tituloFormulario">
                Crear nuevo producto
            </h2>


            <input
                type="text"
                id="nombre"
                placeholder="Nombre del producto"
            >


            <input
                type="number"
                id="precio"
                placeholder="Precio"
                min="0"
            >


            <select id="categoria_id">

                <option value="">
                    Seleccionar categoría
                </option>

                <option value="1">
                    Bebidas
                </option>

                <option value="2">
                    Aseo
                </option>

                <option value="3">
                    Granos
                </option>

                <option value="4">
                    Dulces
                </option>

                <option value="5">
                    Enlatados
                </option>

                <option value="6">
                    Galletas
                </option>

                <option value="7">
                    Verduras
                </option>

                <option value="8">
                    Lácteos
                </option>

            </select>


            <input
                type="number"
                id="cantidad"
                placeholder="Cantidad disponible"
                min="0"
            >


            <button onclick="guardarProducto()">
                Guardar producto
            </button>


            <button
                class="btn-cancelar"
                onclick="cancelarEdicion()"
                id="btnCancelar"
                style="display:none;"
            >
                Cancelar
            </button>

        </div>


        <!-- LISTA DE PRODUCTOS -->

        <h2>
            📋 Productos registrados
        </h2>


        <div class="contenedor-tabla">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Nombre</th>

                        <th>Precio</th>

                        <th>Categoría</th>

                        <th>Cantidad</th>

                        <th>Acciones</th>

                    </tr>

                </thead>


                <tbody id="tablaProductos"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

let productos = [];

let productoEditando = null;


/* =========================
   INGRESAR
========================= */

function ingresar() {

    const usuario =
        document.getElementById("usuario").value.trim();

    const password =
        document.getElementById("password").value;


    if (
        usuario === "maikol" &&
        password === "maikolcamargo12"
    ) {

        document.getElementById("login").style.display =
            "none";


        document.getElementById("panel").style.display =
            "block";


        cargarProductos();


    } else {

        alert(
            "Usuario o contraseña incorrectos"
        );

    }

}


/* =========================
   CARGAR PRODUCTOS
========================= */

async function cargarProductos() {

    try {

        const respuesta =
            await fetch("/api/productos");


        productos =
            await respuesta.json();


        mostrarProductos(productos);


        actualizarResumen(productos);


    } catch (error) {

        mostrarMensaje(
            "Error al cargar los productos",
            "error"
        );

    }

}


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos(lista) {

    const tabla =
        document.getElementById(
            "tablaProductos"
        );


    tabla.innerHTML = "";


    lista.forEach(producto => {

        const fila =
            document.createElement("tr");


        fila.innerHTML = `

            <td>
                ${producto.id}
            </td>

            <td>
                ${producto.nombre}
            </td>

            <td>
                $${Number(producto.precio)
                    .toLocaleString("es-CO")}
            </td>

            <td>
                ${obtenerCategoria(
                    producto.categoria_id
                )}
            </td>

            <td>
                ${producto.cantidad}
            </td>

            <td>

                <button
                    class="btn-editar"
                    onclick="editarProducto(${producto.id})"
                >
                    ✏️ Editar
                </button>


                <button
                    class="btn-eliminar"
                    onclick="eliminarProducto(${producto.id})"
                >
                    🗑️ Eliminar
                </button>

            </td>

        `;


        tabla.appendChild(fila);

    });

}


/* =========================
   CATEGORÍAS
========================= */

function obtenerCategoria(id) {

    const categorias = {

        1: "Bebidas",

        2: "Aseo",

        3: "Granos",

        4: "Dulces",

        5: "Enlatados",

        6: "Galletas",

        7: "Verduras",

        8: "Lácteos"

    };


    return categorias[id] ||
        "Sin categoría";

}


/* =========================
   GUARDAR PRODUCTO
========================= */

async function guardarProducto() {

    const nombre =
        document.getElementById(
            "nombre"
        ).value.trim();


    const precio =
        Number(
            document.getElementById(
                "precio"
            ).value
        );


    const categoria_id =
        Number(
            document.getElementById(
                "categoria_id"
            ).value
        );


    const cantidad =
        Number(
            document.getElementById(
                "cantidad"
            ).value
        );


    if (
        nombre === "" ||
        isNaN(precio) ||
        precio < 0 ||
        !categoria_id ||
        isNaN(cantidad) ||
        cantidad < 0
    ) {

        mostrarMensaje(
            "Completa todos los campos correctamente.",
            "error"
        );

        return;

    }


    const datos = {

        nombre: nombre,

        precio: precio,

        categoria_id: categoria_id,

        cantidad: cantidad

    };


    try {

        let respuesta;


        /* CREAR */

        if (
            productoEditando === null
        ) {

            respuesta =
                await fetch(
                    "/api/productos",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(datos)
                    }
                );


        /* EDITAR */

        } else {

            respuesta =
                await fetch(
                    `/api/productos/${productoEditando}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(datos)
                    }
                );

        }


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo guardar el producto"
            );

        }


        if (
            productoEditando === null
        ) {

            mostrarMensaje(
                "Producto creado correctamente.",
                "exito"
            );


        } else {

            mostrarMensaje(
                "Producto actualizado correctamente.",
                "exito"
            );

        }


        limpiarFormulario();


        await cargarProductos();


    } catch (error) {

        console.error(error);


        mostrarMensaje(
            "Ocurrió un error al guardar el producto.",
            "error"
        );

    }

}


/* =========================
   EDITAR
========================= */

function editarProducto(id) {

    const producto =
        productos.find(
            p => p.id === id
        );


    if (!producto) return;


    productoEditando = id;


    document.getElementById(
        "nombre"
    ).value =
        producto.nombre;


    document.getElementById(
        "precio"
    ).value =
        producto.precio;


    document.getElementById(
        "categoria_id"
    ).value =
        producto.categoria_id;


    document.getElementById(
        "cantidad"
    ).value =
        producto.cantidad;


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Editar producto";


    document.getElementById(
        "btnCancelar"
    ).style.display =
        "inline-block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================
   CANCELAR EDICIÓN
========================= */

function cancelarEdicion() {

    limpiarFormulario();

}


/* =========================
   LIMPIAR FORMULARIO
========================= */

function limpiarFormulario() {

    document.getElementById(
        "nombre"
    ).value = "";


    document.getElementById(
        "precio"
    ).value = "";


    document.getElementById(
        "categoria_id"
    ).value = "";


    document.getElementById(
        "cantidad"
    ).value = "";


    productoEditando = null;


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Crear nuevo producto";


    document.getElementById(
        "btnCancelar"
    ).style.display =
        "none";

}


/* =========================
   ELIMINAR
========================= */

async function eliminarProducto(id) {

    const producto =
        productos.find(
            p => p.id === id
        );


    if (!producto) return;


    const confirmar =
        confirm(
            `¿Seguro que quieres eliminar "${producto.nombre}"?`
        );


    if (!confirmar) return;


    try {

        const respuesta =
            await fetch(
                `/api/productos/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo eliminar"
            );

        }


        mostrarMensaje(
            "Producto eliminado correctamente.",
            "exito"
        );


        await cargarProductos();


    } catch (error) {

        console.error(error);


        mostrarMensaje(
            "Ocurrió un error al eliminar.",
            "error"
        );

    }

}


/* =========================
   RESUMEN
========================= */

function actualizarResumen(lista) {

    const total =
        lista.length;


    const valorInventario =
        lista.reduce(

            (total, producto) =>

                total +
                (
                    Number(producto.precio) *
                    Number(producto.cantidad)
                ),

            0
        );


    const pocoStock =
        lista.filter(

            producto =>

                Number(producto.cantidad) > 0 &&

                Number(producto.cantidad) <= 5

        ).length;


    const agotados =
        lista.filter(

            producto =>

                Number(producto.cantidad) === 0

        ).length;


    document.getElementById(
        "totalProductos"
    ).textContent =
        total;


    document.getElementById(
        "valorInventario"
    ).textContent =
        "$" +
        valorInventario.toLocaleString(
            "es-CO"
        );


    document.getElementById(
        "pocoStock"
    ).textContent =
        pocoStock;


    document.getElementById(
        "agotados"
    ).textContent =
        agotados;

}


/* =========================
   MENSAJES
========================= */

function mostrarMensaje(
    texto,
    tipo
) {

    const mensaje =
        document.getElementById(
            "mensaje"
        );


    mensaje.textContent =
        texto;


    mensaje.style.display =
        "block";


    if (
        tipo === "exito"
    ) {

        mensaje.style.background =
            "#d4edda";

        mensaje.style.color =
            "#155724";


    } else {

        mensaje.style.background =
            "#f8d7da";

        mensaje.style.color =
            "#721c24";

    }


    setTimeout(() => {

        mensaje.style.display =
            "none";

    }, 3000);

}

</script>

</body>
</html>
